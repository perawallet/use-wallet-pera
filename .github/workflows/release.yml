name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # Everything that runs third-party code (dependencies, linters, the test
  # runner, the bundler) happens here, in a job that cannot mint an OIDC token.
  # It hands the publish job a packed tarball and nothing else.
  build:
    runs-on: ubuntu-24.04
    outputs:
      dist_tag: ${{ steps.channel.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm

      # A tag can be pushed on any commit; only reviewed code on main ships.
      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} is not on main"; exit 1; }

      - name: Resolve release channel
        id: channel
        run: |
          VERSION=$(node -p "require('./package.json').version")
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} != package version v$VERSION"; exit 1; }
          if [[ "$VERSION" == *-* ]]; then
            # 1.0.0-beta.0 -> beta, so prereleases never land on "latest"
            PRERELEASE_ID="${VERSION#*-}"
            echo "dist_tag=${PRERELEASE_ID%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build and verify
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm exec publint

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git --no-banner --redact .

      # The last gate before npm. Source-level scanning can miss a secret that
      # only a build step inlines, and a published tarball cannot be recalled.
      - name: Scan built bundle for secrets
        run: ./gitleaks dir --no-banner --redact dist

      - name: Pack
        run: pnpm pack --out package.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: package.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the publish identity, so it runs nothing but pinned npm on the
  # tarball the build job produced: no checkout, no install, no scripts.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Pinned: OIDC trusted publishing needs npm >= 11.5.1, and an unpinned
      # `npm@latest` would run whatever was published minutes ago with the
      # publish token in reach.
      - name: Install npm
        run: npm install -g npm@11.20.0 --ignore-scripts && npm --version

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      - name: Publish (OIDC trusted publishing, no token)
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: npm publish package.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"
