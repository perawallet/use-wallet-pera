name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          [ "v$PKG_VERSION" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package version v$PKG_VERSION"; exit 1; }

      - name: Build and verify
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm exec publint

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git --no-banner --redact .

      # The last gate before npm. Source-level scanning can miss a secret that
      # only a build step inlines, and a published tarball cannot be recalled.
      - name: Scan built bundle for secrets
        run: ./gitleaks dir --no-banner --redact dist

      - name: Update npm for OIDC support
        run: npm install -g npm@latest && npm --version # OIDC trusted publishing requires npm >= 11.5.1

      - name: Publish (OIDC trusted publishing, no token)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            # npm >= 11.6 requires an explicit --tag for prerelease versions
            # so they don't land on the "latest" dist-tag (1.0.0-beta.0 -> beta)
            PRERELEASE_ID="${VERSION#*-}"
            DIST_TAG="${PRERELEASE_ID%%.*}"
            npm publish --access public --provenance --tag "$DIST_TAG"
          else
            npm publish --access public --provenance
          fi
