name: pre-merge

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege default. Jobs that need more should override locally.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".tool-versions"
          cache: "pnpm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fail the build on any moderate+ vulnerability in runtime deps.
      # Dev-only advisories are reported but not blocking.
      - name: pnpm audit (runtime)
        run: pnpm audit --prod --audit-level=moderate

      - name: pnpm audit (all, informational)
        if: always()
        run: pnpm audit --audit-level=low || true

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # publint validates the published package shape (exports map, types);
      # the tarball grep ensures nothing beyond the declared surface
      # (dist, package.json, README, LICENSE) ships to npm.
      - name: Package lint (publint + tarball check)
        run: |
          pnpm exec publint
          pnpm pack --out /tmp/pkg.tgz
          tar -tzf /tmp/pkg.tgz | grep -v '^package/\(dist/\|package.json\|README.md\|LICENSE\)' \
            && { echo "Unexpected files in tarball"; exit 1; } || true

      - name: Test with coverage
        run: pnpm test:coverage

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    env:
      # The gitleaks CLI is free and Apache-2.0; only the gitleaks-action
      # wrapper needs a paid licence for organisations, so install the binary
      # directly. Pinned by version and verified against the release checksum.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Whole history: a secret is just as published if it was committed,
          # reverted, and only the revert landed in this PR.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan history for secrets
        run: ./gitleaks git --no-banner --redact .
